spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/knowledge_server?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.codersole.knowledgeserver: ${LOG_LEVEL_APP:DEBUG}
